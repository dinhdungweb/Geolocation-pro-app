name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build and unit tests never connect to a database; Prisma only needs a
      # syntactically valid URL to generate the client.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SHOPIFY_API_KEY: ci-api-key
      SHOPIFY_API_SECRET: ci-api-secret
      SHOPIFY_APP_URL: https://ci.example.com
      SCOPES: read_markets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Storefront asset matches its source
        run: |
          if ! git diff --exit-code -- extensions/geolocation-popup/assets/geolocation.js; then
            echo "::error::extensions/geolocation-popup/assets/geolocation.js is out of date. Run 'npm run build:storefront' and commit the result."
            exit 1
          fi
